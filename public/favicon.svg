<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <style>
        .bg {
            fill: #234b38;
        }
        .tag {
            fill: #ffffff;
        }
        .cutout {
            fill: #234b38;
        }
        .dot {
            fill: #4ade80;
        }
        @media (prefers-color-scheme: dark) {
            .bg {
                fill: #11261c;
                stroke: #2d6148;
                stroke-width: 2px;
            }
            .tag {
                fill: #f8fafc;
            }
            .cutout {
                fill: #11261c;
            }
            .dot {
                fill: #34d399;
            }
        }
    </style>

    <!-- Squircle Base -->
    <rect class="bg" x="2" y="2" width="60" height="60" rx="16" />

    <!-- Minimalist Recovery Tag Body -->
    <path
        class="tag"
        d="M16 19C16 17.3431 17.3431 16 19 16H33.5147C34.3104 16 35.0734 16.3161 35.636 16.8787L48.1213 29.364C49.2929 30.5355 49.2929 32.435 48.1213 33.6066L33.6066 48.1213C32.435 49.2929 30.5355 49.2929 29.364 48.1213L16.8787 35.636C16.3161 35.0734 16 34.3104 16 33.5147V19Z"
    />

    <!-- Keyring Hole -->
    <circle class="cutout" cx="23" cy="23" r="3.5" />

    <!-- Embedded QR Finder Square -->
    <rect class="cutout" x="27" y="27" width="12" height="12" rx="3" />
    <rect class="dot" x="30.5" y="30.5" width="5" height="5" rx="1.2" />
</svg>

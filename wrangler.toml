# wrangler.toml
name = "findr-incat"
pages_build_output_dir = "dist"
compatibility_date = "2025-02-14"

[[d1_databases]]
binding = "DB"
database_name = "findr-incat-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "findr-incat-media"

[vars]
PUBLIC_APP_NAME = "Findr INCAT"
PUBLIC_ORIGIN = "https://myfindr.pages.dev"